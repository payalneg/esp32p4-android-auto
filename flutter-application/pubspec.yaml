name: aa_bridge
description: "Notification + media BLE bridge to ESP32-P4 head unit."
publish_to: 'none'
version: 0.3.1+59

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_blue_plus: ^1.32.12
  flutter_foreground_task: ^8.10.0
  shared_preferences: ^2.2.3
  permission_handler: ^11.3.1
  flutter_local_notifications: ^17.2.3
  crypto: ^3.0.3
  protobuf: ^3.1.0
  rxdart: ^0.27.7
  package_info_plus: ^8.0.0
  file_picker: ^8.1.2
  path_provider: ^2.1.4
  image: ^4.2.0
  # The DeepSeek API key belongs in the Android Keystore / iOS Keychain, not in
  # SharedPreferences (which lands in adb/cloud backups).
  flutter_secure_storage: ^9.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    # Per-board P4 firmware images bundled for over-WiFi OTA flashing from the
    # app. The app picks the one matching the head unit's reported board model
    # (see lib/firmware/firmware_updater.dart). Refresh all with
    # scripts/stage_firmware_asset.sh after building each board.
    - assets/firmware/esp32p4_android_auto-waveshare.bin
    - assets/firmware/esp32p4_android_auto-jc4880.bin
    - assets/firmware/version.txt
    # VESC BLE Helper (ESP32-C3) firmware, so it can be flashed with no network.
    # Fetched from that project's GitHub releases by
    # scripts/stage_firmware_asset.sh — never committed here.
    - assets/firmware/esp32c3_ble_helper.bin
    - assets/firmware/esp32c3_ble_helper_version.txt

# Run: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon_legacy.png"
  adaptive_icon_background: "#161B1E"
  adaptive_icon_foreground: "assets/icon_foreground.png"
